[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["crates/*", "apps/mksigma", "apps/mksigma-cli", "apps/mksigma-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
# internal
mksigma-core = { path = "crates/core" }
mksigma-sav = { path = "crates/sav" }
mksigma-csv = { path = "crates/csv" }
mksigma-stats = { path = "crates/stats" }
mksigma-syntax = { path = "crates/syntax" }
mksigma-output = { path = "crates/output" }
mksigma-engine = { path = "crates/engine" }
mksigma-ui-egui = { path = "crates/ui-egui" }
mksigma-web = { path = "crates/web" }

# foundation
thiserror = "2"
# Text in system files can be in any legacy code page (record 7.20 or 7.3 says which).
encoding_rs = "0.8"
# Distribution functions (chi-square, t, F) for significance levels. MIT, pure Rust.
statrs = { version = "0.19", default-features = false }

# The app's logo (a PNG) decoded for the window icon and the title row. MIT/Apache, pure Rust.
png = "0.18"

# The MCP server's JSON-RPC messages. MIT/Apache.
serde_json = "1"

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
rfd = "0.17"
egui_kittest = "0.36"

[workspace.lints.rust]
unsafe_code = "forbid"

# The dashboard engine compiled to WebAssembly, embedded in exported pages: small over fast.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
