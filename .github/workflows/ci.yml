# The AGENTS.md quality gate, `cargo xtask ci` (fmt, clippy -D warnings, tests, assets, layers,
# panics, wasm), on every pull request and every push to main. The wasm32 target is installed and
# MKSIGMA_REQUIRE_WASM set, so the engine the dashboards embed is built, and its break fails CI
# instead of shipping an empty engine (#47).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: cargo xtask ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies (winit, wgpu)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libfontconfig1-dev libfreetype-dev

      - name: Install Rust (stable + clippy, rustfmt, wasm32)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt \
            --target wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `cargo xtask ci` doesn't pass --locked: a Cargo.lock out of step with the manifests fails here.
      - name: Lockfile up to date
        run: cargo fetch --locked

      - name: Quality gate
        env:
          MKSIGMA_REQUIRE_WASM: "1"
        run: cargo xtask ci
